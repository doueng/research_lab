<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1000 480' width='1000' height='480'><style>
text{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#1f2328}
.t{font-size:15px;font-weight:600}.s{font-size:12px;fill:#57606a}.c{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;fill:#24292f}
.h{font-size:18px;font-weight:700}.lbl{font-size:11px;fill:#57606a}
.lc{fill:#E8F4F1;stroke:#2F6868;stroke-width:1.5}.lg{fill:#EEF0FF;stroke:#4F46E5;stroke-width:1.5}
.ls{fill:#FFF1E8;stroke:#D9622B;stroke-width:1.5}.db{fill:#F6F8FA;stroke:#8C959F;stroke-width:1.5}
.ex{fill:#FFFFFF;stroke:#8C959F;stroke-width:1.2;stroke-dasharray:5 4}
.ar{stroke:#57606a;stroke-width:1.6;fill:none;marker-end:url(#a)}
.ad{stroke:#D9622B;stroke-width:1.4;fill:none;stroke-dasharray:4 4;marker-end:url(#ao)}
</style>
<defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0L10,5L0,10z' fill='#57606a'/></marker>
<marker id='ao' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0L10,5L0,10z' fill='#D9622B'/></marker></defs><rect width='1000' height='480' rx='12' fill='#FFFFFF'/><text class='h' x='24' y='34'>One tick: load, plan, investigate, record, reflect</text><rect class='lc' x='622' y='22' width='14' height='14' rx='10'/><text class='lbl' x='642' y='33'>LangChain</text><rect class='lg' x='717' y='22' width='14' height='14' rx='10'/><text class='lbl' x='737' y='33'>LangGraph</text><rect class='ls' x='812' y='22' width='14' height='14' rx='10'/><text class='lbl' x='832' y='33'>LangSmith</text><rect class='db' x='907' y='22' width='14' height='14' rx='10'/><text class='lbl' x='927' y='33'>Local state</text><text class='lbl' x='24' y='60'>src/lab/graph.py · each node returns a partial update to TickState (TypedDict)</text><rect class='db' x='20' y='80' width='180' height='210' rx='10'/><text class='t' x='34' y='104'>load</text><text class='s' x='34' y='122'>plain Python node</text><text class='s' x='34' y='140'></text><text class='s' x='34' y='158'>reads the dataroom:</text><text class='c' x='34' y='176'>objective</text><text class='c' x='34' y='194'>scratchpad</text><text class='c' x='34' y='212'>frontier (top 15 leads)</text><rect class='lc' x='215' y='80' width='180' height='210' rx='10'/><text class='t' x='229' y='104'>plan</text><text class='c' x='229' y='122'>with_structured_output</text><text class='c' x='229' y='140'>  (Plan)</text><text class='s' x='229' y='158'></text><text class='s' x='229' y='176'>picks ONE lead_id, or an</text><text class='s' x='229' y='194'>explore_query (~1 in 5)</text><text class='s' x='229' y='212'>falls back to the top</text><text class='s' x='229' y='230'>lead if the pick is invalid</text><rect class='lc' x='410' y='80' width='180' height='210' rx='10'/><text class='t' x='424' y='104'>investigate</text><text class='c' x='424' y='122'>create_agent(model,</text><text class='c' x='424' y='140'>  tools, middleware,</text><text class='c' x='424' y='158'>  response_format)</text><text class='s' x='424' y='176'>≤ 12 tool calls</text><text class='s' x='424' y='194'>Investigation schema</text><text class='s' x='424' y='212'>drops findings whose URL</text><text class='s' x='424' y='230'>never appeared in a tool</text><text class='s' x='424' y='248'>result (anti-hallucination)</text><rect class='db' x='605' y='80' width='180' height='210' rx='10'/><text class='t' x='619' y='104'>record</text><text class='s' x='619' y='122'>plain Python node</text><text class='s' x='619' y='140'></text><text class='c' x='619' y='158'>INSERT OR IGNORE</text><text class='s' x='619' y='176'>findings (dedupe by URL)</text><text class='s' x='619' y='194'>new leads (dedupe by</text><text class='s' x='619' y='212'>target), lead marked done</text><text class='s' x='619' y='230'>idempotent, safe to replay</text><rect class='lc' x='800' y='80' width='180' height='210' rx='10'/><text class='t' x='814' y='104'>reflect</text><text class='c' x='814' y='122'>with_structured_output</text><text class='c' x='814' y='140'>  (Reflection)</text><text class='s' x='814' y='158'></text><text class='s' x='814' y='176'>rewrites the scratchpad</text><text class='s' x='814' y='194'>(≤ 2500 chars) and</text><text class='s' x='814' y='212'>re-scores open leads</text><text class='s' x='814' y='230'>= the self-editing step</text><path class='ar' d='M202,185 L213,185'/><path class='ar' d='M397,185 L408,185'/><path class='ar' d='M592,185 L603,185'/><path class='ar' d='M787,185 L798,185'/><path class='ar' d='M890,292 L890,322 L110,322 L110,294'/><text class='s' x='500' y='316' text-anchor='middle'>next tick reads the edited scratchpad and the re-ranked frontier</text><rect class='lg' x='20' y='344' width='960' height='116' rx='10'/><text class='t' x='34' y='368'>Durable execution with a LangGraph checkpointer</text><text class='c' x='34' y='386'>graph = builder.compile(checkpointer=SqliteSaver(conn))</text><text class='c' x='34' y='404'>config = {"configurable": {"thread_id": f"tick-{n}"}}</text><text class='c' x='34' y='422'>resuming = bool(graph.get_state(config).next);  graph.invoke(None if resuming else {"tick": n}, config)</text><text class='s' x='34' y='440'>State is saved after every node, so a crashed tick resumes at the failed node instead of repeating paid LLM calls.</text></svg>

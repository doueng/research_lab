<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1000 520' width='1000' height='520'><style>
text{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#1f2328}
.t{font-size:15px;font-weight:600}.s{font-size:12px;fill:#57606a}.c{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;fill:#24292f}
.h{font-size:18px;font-weight:700}.lbl{font-size:11px;fill:#57606a}
.lc{fill:#E8F4F1;stroke:#2F6868;stroke-width:1.5}.lg{fill:#EEF0FF;stroke:#4F46E5;stroke-width:1.5}
.ls{fill:#FFF1E8;stroke:#D9622B;stroke-width:1.5}.db{fill:#F6F8FA;stroke:#8C959F;stroke-width:1.5}
.ex{fill:#FFFFFF;stroke:#8C959F;stroke-width:1.2;stroke-dasharray:5 4}
.ar{stroke:#57606a;stroke-width:1.6;fill:none;marker-end:url(#a)}
.ad{stroke:#D9622B;stroke-width:1.4;fill:none;stroke-dasharray:4 4;marker-end:url(#ao)}
.tr{stroke:#D9622B;stroke-width:1.2;fill:none}</style>
<defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0L10,5L0,10z' fill='#57606a'/></marker>
<marker id='ao' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0L10,5L0,10z' fill='#D9622B'/></marker></defs><rect width='1000' height='520' rx='12' fill='#FFFFFF'/><text class='h' x='24' y='34'>LangSmith: observe every tick, then evaluate it</text><rect class='lc' x='622' y='22' width='14' height='14' rx='10'/><text class='lbl' x='642' y='33'>LangChain</text><rect class='lg' x='717' y='22' width='14' height='14' rx='10'/><text class='lbl' x='737' y='33'>LangGraph</text><rect class='ls' x='812' y='22' width='14' height='14' rx='10'/><text class='lbl' x='832' y='33'>LangSmith</text><rect class='db' x='907' y='22' width='14' height='14' rx='10'/><text class='lbl' x='927' y='33'>Local state</text><rect class='ls' x='20' y='60' width='440' height='440' rx='10'/><text class='t' x='34' y='84'>Trace of one lab tick (simplified)</text><text class='s' x='34' y='102'>project research-lab · thread tick-&lt;n&gt;</text><rect class='lg' x='40' y='123' width='12' height='12' rx='3'/><text class='c' x='60' y='134'>LangGraph  (StateGraph run)</text><path class='tr' d='M48,140 L48,151 L60,151'/><rect class='db' x='62' y='145' width='12' height='12' rx='3'/><text class='c' x='82' y='156'>load</text><path class='tr' d='M48,162 L48,173 L60,173'/><rect class='lg' x='62' y='167' width='12' height='12' rx='3'/><text class='c' x='82' y='178'>plan</text><path class='tr' d='M70,184 L70,195 L82,195'/><rect class='lc' x='84' y='189' width='12' height='12' rx='3'/><text class='c' x='104' y='200'>ChatCodex → Plan</text><path class='tr' d='M48,206 L48,217 L60,217'/><rect class='lg' x='62' y='211' width='12' height='12' rx='3'/><text class='c' x='82' y='222'>investigate</text><path class='tr' d='M70,228 L70,239 L82,239'/><rect class='lg' x='84' y='233' width='12' height='12' rx='3'/><text class='c' x='104' y='244'>LangGraph  (create_agent)</text><path class='tr' d='M92,250 L92,261 L104,261'/><rect class='lc' x='106' y='255' width='12' height='12' rx='3'/><text class='c' x='126' y='266'>model → ChatCodex</text><path class='tr' d='M92,272 L92,283 L104,283'/><rect class='lc' x='106' y='277' width='12' height='12' rx='3'/><text class='c' x='126' y='288'>tools → tavily_search</text><path class='tr' d='M92,294 L92,305 L104,305'/><rect class='lc' x='106' y='299' width='12' height='12' rx='3'/><text class='c' x='126' y='310'>model → ChatCodex</text><path class='tr' d='M92,316 L92,327 L104,327'/><rect class='lc' x='106' y='321' width='12' height='12' rx='3'/><text class='c' x='126' y='332'>tools → fetch_url</text><path class='tr' d='M92,338 L92,349 L104,349'/><rect class='db' x='106' y='343' width='12' height='12' rx='3'/><text class='c' x='126' y='354'>…  ≤ 12 tool calls</text><path class='tr' d='M92,360 L92,371 L104,371'/><rect class='lc' x='106' y='365' width='12' height='12' rx='3'/><text class='c' x='126' y='376'>model → Investigation</text><path class='tr' d='M48,382 L48,393 L60,393'/><rect class='db' x='62' y='387' width='12' height='12' rx='3'/><text class='c' x='82' y='398'>record</text><path class='tr' d='M48,404 L48,415 L60,415'/><rect class='lg' x='62' y='409' width='12' height='12' rx='3'/><text class='c' x='82' y='420'>reflect</text><path class='tr' d='M70,426 L70,437 L82,437'/><rect class='lc' x='84' y='431' width='12' height='12' rx='3'/><text class='c' x='104' y='442'>ChatCodex → Reflection</text><text class='s' x='40' y='480'>Each run records inputs, outputs, tokens, latency and errors.</text><rect class='ls' x='500' y='60' width='480' height='136' rx='10'/><text class='t' x='514' y='84'>What tracing answers today</text><text class='s' x='514' y='102'>• Which lead did plan pick, and why (the Plan rationale)?</text><text class='s' x='514' y='120'>• Which searches and pages did the agent use within its budget?</text><text class='s' x='514' y='138'>• Where did a crashed tick fail, and what did resume replay?</text><text class='s' x='514' y='156'>• How many tokens and seconds does a tick cost?</text><text class='s' x='514' y='174'>Enabled only through LANGSMITH_* in .env, no code changes.</text><text class='t' x='500' y='232'>Planned: evaluation loop</text><rect class='db' x='500' y='248' width='480' height='44' rx='10'/><text class='c' x='514' y='266'>lab rate ID 1-5</text><text class='s' x='514' y='283'>human ratings stored with each finding in SQLite</text><path class='ar' d='M740,294 L740,310'/><rect class='ls' x='500' y='312' width='480' height='44' rx='10'/><text class='c' x='514' y='330'>Client.create_dataset / create_examples</text><text class='s' x='514' y='347'>rated findings become a LangSmith dataset</text><path class='ar' d='M740,358 L740,374'/><rect class='ls' x='500' y='376' width='480' height='44' rx='10'/><text class='c' x='514' y='394'>evaluate(target, data=..., evaluators=[...])</text><text class='s' x='514' y='411'>variants: scratchpad only, frontier only, both</text><path class='ar' d='M740,422 L740,438'/><rect class='ls' x='500' y='440' width='480' height='44' rx='10'/><text class='c' x='514' y='458'>Experiments view</text><text class='s' x='514' y='475'>compare variants on the same examples</text></svg>

<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 960 510' width='960' height='510'><style>
text{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#1f2328}
.t{font-size:15px;font-weight:600}.s{font-size:12px;fill:#57606a}.c{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;fill:#24292f}
.h{font-size:18px;font-weight:700}.lbl{font-size:11px;fill:#57606a}
.lc{fill:#E8F4F1;stroke:#2F6868;stroke-width:1.5}.lg{fill:#EEF0FF;stroke:#4F46E5;stroke-width:1.5}
.ls{fill:#FFF1E8;stroke:#D9622B;stroke-width:1.5}.db{fill:#F6F8FA;stroke:#8C959F;stroke-width:1.5}
.ex{fill:#FFFFFF;stroke:#8C959F;stroke-width:1.2;stroke-dasharray:5 4}
.ar{stroke:#57606a;stroke-width:1.6;fill:none;marker-end:url(#a)}
.ad{stroke:#D9622B;stroke-width:1.4;fill:none;stroke-dasharray:4 4;marker-end:url(#ao)}
</style>
<defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0L10,5L0,10z' fill='#57606a'/></marker>
<marker id='ao' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0L10,5L0,10z' fill='#D9622B'/></marker></defs><rect width='960' height='510' rx='12' fill='#FFFFFF'/><text class='h' x='24' y='34'>Research Lab architecture</text><rect class='lc' x='582' y='22' width='14' height='14' rx='10'/><text class='lbl' x='602' y='33'>LangChain</text><rect class='lg' x='677' y='22' width='14' height='14' rx='10'/><text class='lbl' x='697' y='33'>LangGraph</text><rect class='ls' x='772' y='22' width='14' height='14' rx='10'/><text class='lbl' x='792' y='33'>LangSmith</text><rect class='db' x='867' y='22' width='14' height='14' rx='10'/><text class='lbl' x='887' y='33'>Local state</text><rect class='ex' x='20' y='70' width='180' height='150' rx='10'/><text class='t' x='34' y='94'>lab CLI</text><text class='c' x='34' y='112'>lab seed</text><text class='c' x='34' y='130'>lab tick</text><text class='c' x='34' y='148'>lab status / findings</text><text class='c' x='34' y='166'>lab rate ID N</text><text class='c' x='34' y='184'>lab lead URL WHY</text><text class='s' x='34' y='202'>one tick = one heartbeat</text><rect class='lg' x='240' y='60' width='430' height='252' rx='10'/><text class='t' x='254' y='84'>LangGraph StateGraph (one tick)</text><text class='s' x='254' y='102'>TypedDict state, linear edges, compiled with a checkpointer</text><rect class='lg' x='256' y='110' width='48' height='32' rx='16'/><text class='c' x='280' y='130' text-anchor='middle'>load</text><path class='ar' d='M306,126 L324,126'/><rect class='lg' x='326' y='110' width='48' height='32' rx='16'/><text class='c' x='350' y='130' text-anchor='middle'>plan</text><path class='ar' d='M376,126 L394,126'/><rect class='lg' x='396' y='110' width='90' height='32' rx='16'/><text class='c' x='441' y='130' text-anchor='middle'>investigate</text><path class='ar' d='M488,126 L506,126'/><rect class='lg' x='508' y='110' width='62' height='32' rx='16'/><text class='c' x='539' y='130' text-anchor='middle'>record</text><path class='ar' d='M572,126 L590,126'/><rect class='lg' x='592' y='110' width='62' height='32' rx='16'/><text class='c' x='623' y='130' text-anchor='middle'>reflect</text><rect class='lc' x='256' y='162' width='398' height='136' rx='10'/><text class='t' x='270' y='186'>Investigator: langchain create_agent</text><text class='c' x='270' y='204'>model + tools ReAct loop</text><text class='c' x='270' y='222'>ToolCallLimitMiddleware(run_limit=12)</text><text class='c' x='270' y='240'>response_format=ToolStrategy(Investigation)</text><text class='c' x='270' y='258'>Pydantic schemas: Plan, Investigation, Reflection</text><text class='s' x='270' y='276'>plan/reflect use model.with_structured_output(...)</text><path class='ar' d='M425,144 L425,160'/><rect class='lc' x='712' y='60' width='228' height='120' rx='10'/><text class='t' x='726' y='84'>Chat model</text><text class='c' x='726' y='102'>init_chat_model("openai:…")</text><text class='c' x='726' y='120'>ChatCodex(ChatOpenAI)</text><text class='s' x='726' y='138'>Responses API, streaming,</text><text class='s' x='726' y='156'>system msg → instructions</text><rect class='lc' x='712' y='196' width='228' height='116' rx='10'/><text class='t' x='726' y='220'>Tools (read-only)</text><text class='c' x='726' y='238'>TavilySearch(max_results=8)</text><text class='c' x='726' y='256'>@tool fetch_url</text><text class='s' x='726' y='274'>pages wrapped as untrusted</text><text class='s' x='726' y='292'>data, links extracted</text><path class='ar' d='M656,172 L710,172'/><path class='ar' d='M656,262 L710,262'/><path class='ar' d='M202,140 L238,140'/><rect class='ex' x='20' y='350' width='180' height='120' rx='10'/><text class='t' x='34' y='374'>seeds/&lt;subject&gt;.toml</text><text class='s' x='34' y='392'>objective + starting leads</text><text class='s' x='34' y='410'>loaded by lab seed</text><text class='c' x='34' y='428'>guix  memory</text><text class='c' x='34' y='446'>hypertrophy  london</text><rect class='db' x='240' y='350' width='200' height='120' rx='10'/><text class='t' x='254' y='374'>Dataroom (SQLite)</text><text class='c' x='254' y='392'>data/&lt;subject&gt;.db</text><text class='s' x='254' y='410'>meta: objective, scratchpad</text><text class='s' x='254' y='428'>leads (the frontier)</text><text class='s' x='254' y='446'>findings, ticks, ratings</text><rect class='db' x='460' y='350' width='210' height='120' rx='10'/><text class='t' x='474' y='374'>Checkpoints (SQLite)</text><text class='c' x='474' y='392'>SqliteSaver</text><text class='c' x='474' y='410'>data/&lt;subject&gt;.ckpt.db</text><text class='s' x='474' y='428'>thread_id = tick-&lt;n&gt;</text><text class='s' x='474' y='446'>resume after a crash</text><path class='ar' d='M202,410 L238,410'/><path class='ar' d='M330,314 L330,348'/><path class='ar' d='M350,348 L350,314'/><text class='lbl' x='358' y='334'>read / write</text><path class='ar' d='M560,314 L560,348'/><text class='lbl' x='568' y='334'>after each node</text><rect class='ls' x='712' y='350' width='228' height='120' rx='10'/><text class='t' x='726' y='374'>LangSmith</text><text class='c' x='726' y='392'>LANGSMITH_TRACING=true</text><text class='c' x='726' y='410'>project: research-lab</text><text class='s' x='726' y='428'>one trace per tick: every node,</text><text class='s' x='726' y='446'>LLM call and tool call</text><path class='ad' d='M671,300 L690,300 L690,410 L710,410'/><text class='s' x='24' y='498'>Orange dashes = tracing. It needs no code: LangChain and LangGraph read the LANGSMITH_* variables from .env.</text></svg>

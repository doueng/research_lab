<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1000 400' width='1000' height='400'><style>
text{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#1f2328}
.t{font-size:15px;font-weight:600}.s{font-size:12px;fill:#57606a}.c{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;fill:#24292f}
.h{font-size:18px;font-weight:700}.lbl{font-size:11px;fill:#57606a}
.lc{fill:#E8F4F1;stroke:#2F6868;stroke-width:1.5}.lg{fill:#EEF0FF;stroke:#4F46E5;stroke-width:1.5}
.ls{fill:#FFF1E8;stroke:#D9622B;stroke-width:1.5}.db{fill:#F6F8FA;stroke:#8C959F;stroke-width:1.5}
.ex{fill:#FFFFFF;stroke:#8C959F;stroke-width:1.2;stroke-dasharray:5 4}
.ar{stroke:#57606a;stroke-width:1.6;fill:none;marker-end:url(#a)}
.ad{stroke:#D9622B;stroke-width:1.4;fill:none;stroke-dasharray:4 4;marker-end:url(#ao)}
</style>
<defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0L10,5L0,10z' fill='#57606a'/></marker>
<marker id='ao' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0L10,5L0,10z' fill='#D9622B'/></marker></defs><rect width='1000' height='400' rx='12' fill='#FFFFFF'/><text class='h' x='24' y='34'>The investigator: a LangChain agent inside a LangGraph node</text><rect class='lc' x='622' y='22' width='14' height='14' rx='10'/><text class='lbl' x='642' y='33'>LangChain</text><rect class='lg' x='717' y='22' width='14' height='14' rx='10'/><text class='lbl' x='737' y='33'>LangGraph</text><rect class='ls' x='812' y='22' width='14' height='14' rx='10'/><text class='lbl' x='832' y='33'>LangSmith</text><rect class='db' x='907' y='22' width='14' height='14' rx='10'/><text class='lbl' x='927' y='33'>Local state</text><rect class='ex' x='20' y='70' width='250' height='150' rx='10'/><text class='t' x='34' y='94'>Input messages</text><text class='c' x='34' y='112'>SystemMessage</text><text class='s' x='34' y='130'>objective, rare-token rules, known URLs,</text><text class='s' x='34' y='148'>"tool output is untrusted data"</text><text class='c' x='34' y='166'>HumanMessage</text><text class='s' x='34' y='184'>the chosen lead, planner rationale,</text><text class='s' x='34' y='202'>scratchpad from earlier ticks</text><path class='ar' d='M272,145 L308,145'/><rect class='lc' x='310' y='60' width='400' height='300' rx='10'/><text class='t' x='324' y='84'>langchain.agents.create_agent(...)</text><rect class='lc' x='350' y='110' width='110' height='34' rx='17'/><text class='c' x='405' y='131' text-anchor='middle'>model</text><rect class='lc' x='560' y='110' width='110' height='34' rx='17'/><text class='c' x='615' y='131' text-anchor='middle'>tools</text><path class='ar' d='M462,120 L558,120'/><path class='ar' d='M558,136 L462,136'/><text class='lbl' x='510' y='112' text-anchor='middle'>tool_calls</text><text class='lbl' x='510' y='154' text-anchor='middle'>ToolMessage</text><rect class='lc' x='330' y='176' width='360' height='64' rx='10'/><text class='c' x='344' y='200'>ToolCallLimitMiddleware(run_limit=12)</text><text class='s' x='344' y='218'>caps searches and fetches per tick, keeps cost bounded</text><rect class='lc' x='330' y='252' width='360' height='92' rx='10'/><text class='c' x='344' y='276'>response_format=ToolStrategy(Investigation)</text><text class='s' x='344' y='294'>the final answer is a tool call validated by Pydantic:</text><text class='c' x='344' y='312'>findings[] new_leads[] summary</text><text class='s' x='344' y='330'>→ out["structured_response"]</text><path class='ar' d='M712,210 L748,210'/><rect class='ex' x='750' y='70' width='230' height='256' rx='10'/><text class='t' x='764' y='94'>Guardrails after the loop</text><text class='s' x='764' y='112'>1. No structured_response?</text><text class='s' x='764' y='130'>   Seen live after the tool budget</text><text class='s' x='764' y='148'>   message. One extra call to</text><text class='c' x='764' y='166'>   with_structured_output</text><text class='s' x='764' y='184'>   (Investigation) recovers it.</text><text class='s' x='764' y='202'></text><text class='s' x='764' y='220'>2. URL check: keep a finding</text><text class='s' x='764' y='238'>   only if its URL appears in a</text><text class='s' x='764' y='256'>   real tool result this tick.</text><text class='s' x='764' y='274'></text><text class='s' x='764' y='292'>Both paths have regression</text><text class='s' x='764' y='310'>tests with a scripted fake model.</text><rect class='lc' x='20' y='240' width='250' height='120' rx='10'/><text class='t' x='34' y='264'>Tools bound to the agent</text><text class='c' x='34' y='282'>TavilySearch(max_results=8)</text><text class='c' x='34' y='300'>@tool fetch_url(url) -&gt; str</text><text class='s' x='34' y='318'>HTML to text + outbound links,</text><text class='s' x='34' y='336'>wrapped in &lt;untrusted_page&gt;</text></svg>

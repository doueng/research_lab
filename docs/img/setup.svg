<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1000 420' width='1000' height='420'><style>
text{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#1f2328}
.t{font-size:15px;font-weight:600}.s{font-size:12px;fill:#57606a}.c{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;fill:#24292f}
.h{font-size:18px;font-weight:700}.lbl{font-size:11px;fill:#57606a}
.lc{fill:#E8F4F1;stroke:#2F6868;stroke-width:1.5}.lg{fill:#EEF0FF;stroke:#4F46E5;stroke-width:1.5}
.ls{fill:#FFF1E8;stroke:#D9622B;stroke-width:1.5}.db{fill:#F6F8FA;stroke:#8C959F;stroke-width:1.5}
.ex{fill:#FFFFFF;stroke:#8C959F;stroke-width:1.2;stroke-dasharray:5 4}
.ar{stroke:#57606a;stroke-width:1.6;fill:none;marker-end:url(#a)}
.ad{stroke:#D9622B;stroke-width:1.4;fill:none;stroke-dasharray:4 4;marker-end:url(#ao)}
.tr{stroke:#D9622B;stroke-width:1.2;fill:none}</style>
<defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0L10,5L0,10z' fill='#57606a'/></marker>
<marker id='ao' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0L10,5L0,10z' fill='#D9622B'/></marker></defs><rect width='1000' height='420' rx='12' fill='#FFFFFF'/><text class='h' x='24' y='34'>Setup: from clone to first traced tick</text><rect class='lc' x='622' y='22' width='14' height='14' rx='10'/><text class='lbl' x='642' y='33'>LangChain</text><rect class='lg' x='717' y='22' width='14' height='14' rx='10'/><text class='lbl' x='737' y='33'>LangGraph</text><rect class='ls' x='812' y='22' width='14' height='14' rx='10'/><text class='lbl' x='832' y='33'>LangSmith</text><rect class='db' x='907' y='22' width='14' height='14' rx='10'/><text class='lbl' x='927' y='33'>Local state</text><rect class='db' x='20' y='64' width='300' height='138' rx='10'/><text class='t' x='62' y='90'>Toolchain (Guix)</text><text class='c' x='34' y='110'>manifest.scm</text><text class='s' x='34' y='128'>python 3.12, uv, gcc-toolchain,</text><text class='s' x='34' y='146'>sqlite, git, ruff</text><text class='s' x='34' y='164'>Guix does not package LangChain,</text><text class='s' x='34' y='182'>so Python deps come from uv.lock</text><circle cx='44' cy='85' r='11' fill='#1f2328'/><text x='44' y='89' text-anchor='middle' style='fill:#fff;font-size:12px;font-weight:700'>1</text><rect class='db' x='350' y='64' width='300' height='138' rx='10'/><text class='t' x='392' y='90'>Python env</text><text class='c' x='364' y='110'>direnv allow</text><text class='c' x='364' y='128'># or: source dev/env.sh</text><text class='s' x='364' y='146'>builds the profile, then</text><text class='c' x='364' y='164'>uv sync --frozen → .venv</text><text class='s' x='364' y='182'>and puts lab on PATH</text><circle cx='374' cy='85' r='11' fill='#1f2328'/><text x='374' y='89' text-anchor='middle' style='fill:#fff;font-size:12px;font-weight:700'>2</text><rect class='ls' x='680' y='64' width='300' height='138' rx='10'/><text class='t' x='722' y='90'>Credentials (.env)</text><text class='c' x='694' y='110'>cp .env.example .env</text><text class='c' x='694' y='128'>LAB_MODEL=codex:… | openai:…</text><text class='c' x='694' y='146'>TAVILY_API_KEY=…</text><text class='c' x='694' y='164'>LANGSMITH_API_KEY=…</text><text class='c' x='694' y='182'>LANGSMITH_TRACING=true</text><circle cx='704' cy='85' r='11' fill='#1f2328'/><text x='704' y='89' text-anchor='middle' style='fill:#fff;font-size:12px;font-weight:700'>3</text><rect class='db' x='20' y='250' width='300' height='138' rx='10'/><text class='t' x='62' y='276'>Seed a subject</text><text class='c' x='34' y='296'>lab subjects</text><text class='c' x='34' y='314'>lab -s guix seed</text><text class='s' x='34' y='332'>objective + starting leads from</text><text class='c' x='34' y='350'>seeds/guix.toml → data/guix.db</text><text class='s' x='34' y='368'>idempotent, safe to re-run</text><circle cx='44' cy='271' r='11' fill='#1f2328'/><text x='44' y='275' text-anchor='middle' style='fill:#fff;font-size:12px;font-weight:700'>4</text><rect class='lg' x='350' y='250' width='300' height='138' rx='10'/><text class='t' x='392' y='276'>Run a heartbeat</text><text class='c' x='364' y='296'>lab -s guix tick</text><text class='s' x='364' y='314'>one LangGraph run on one lead</text><text class='s' x='364' y='332'>prints findings and new leads</text><text class='s' x='364' y='350'>re-run after a crash to resume</text><text class='s' x='364' y='368'>from the last checkpoint</text><circle cx='374' cy='271' r='11' fill='#1f2328'/><text x='374' y='275' text-anchor='middle' style='fill:#fff;font-size:12px;font-weight:700'>5</text><rect class='ls' x='680' y='250' width='300' height='138' rx='10'/><text class='t' x='722' y='276'>Inspect and steer</text><text class='c' x='694' y='296'>lab status · lab findings</text><text class='c' x='694' y='314'>lab rate 3 5 · lab lead URL WHY</text><text class='s' x='694' y='332'>open the trace in LangSmith,</text><text class='s' x='694' y='350'>project research-lab</text><text class='c' x='694' y='368'>pytest -q   # no keys needed</text><circle cx='704' cy='271' r='11' fill='#1f2328'/><text x='704' y='275' text-anchor='middle' style='fill:#fff;font-size:12px;font-weight:700'>6</text><path class='ar' d='M322,133 L348,133'/><path class='ar' d='M652,133 L678,133'/><path class='ar' d='M830,204 L830,226 L170,226 L170,248'/><path class='ar' d='M322,319 L348,319'/><path class='ar' d='M652,319 L678,319'/></svg>

# Linter config read by pylsp. pycodestyle (pylsp default), flake8 (lsp-mode's pylsp default) and pydocstyle
# do not read pyproject.toml.
[pycodestyle]
max-line-length = 120

[flake8]
max-line-length = 120

[pydocstyle]
# Missing-docstring checks (D1xx) only; formatting rules for docstrings that exist still apply.
add-ignore = D1

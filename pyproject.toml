[project]
name = "lab"
version = "0.1.0"
description = "Seeded, stateful research agent built to learn LangChain/LangGraph"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "langchain>=1.0",
    "langchain-anthropic>=1.7.7",
    "langchain-openai>=1.7.3",
    "langchain-tavily>=0.2.18",
    "langgraph>=1.2.18",
    "langgraph-checkpoint-sqlite>=3.1.2",
    "python-dotenv>=1.2.4",
]

[project.scripts]
lab = "lab.cli:main"

[build-system]
requires = ["hatchling"]  # pure Python; uv_build ships a binary that cannot run on Guix System
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[project]
name = "lab"
version = "0.1.0"
description = "Seeded, stateful research agent built to learn LangChain/LangGraph"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ddgs>=9.16.1",
    "httpx>=0.28.1",
    "langchain>=1.0",
    "langchain-anthropic>=1.7.7",
    "langgraph>=1.2.18",
    "langgraph-checkpoint-sqlite>=3.1.2",
]

[project.scripts]
lab = "lab.cli:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

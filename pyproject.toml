[project]
name = "lab"
version = "0.1.0"
description = "Seeded, stateful research agent built to learn LangChain/LangGraph"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "langchain>=1.0",
    "langchain-core>=1.7.1",
    "langchain-openai>=1.7.3",
    "langchain-tavily>=0.2.18",
    "langgraph>=1.2.18",
    "langgraph-checkpoint-sqlite>=3.1.2",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
]

[project.scripts]
lab = "lab.cli:main"

[build-system]
requires = ["hatchling"]  # pure Python; uv_build ships a binary that cannot run on Guix System
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "D"]  # pycodestyle, pyflakes, pydocstyle
ignore = ["D1"]  # missing-docstring checks; formatting rules for docstrings that exist still apply

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
